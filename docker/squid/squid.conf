# Clients reach this port through Caddy, which terminates their TLS (see PLAN.md, "TLS-wrapped
# proxy port"). It is not published on the host, so it carries proxy credentials in the clear
# only inside the compose network.
http_port 3128 ssl-bump \
    tls-cert=/var/lib/squid-ca/ca.crt \
    tls-key=/var/lib/squid-ca/ca.key \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB
sslcrtd_children 5

visible_hostname sieve-proxy
cache_effective_user proxy
# Needs raw ICMP sockets, which containers don't grant; it's only used for cache peer selection.
pinger_enable off
pid_filename none
shutdown_lifetime 2 seconds
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr

# Device proxy credentials. Squid remembers a verified login for credentialsttl and the ACL
# helper's answers for ttl, so a revoked device keeps working for up to 5 minutes.
auth_param basic program /usr/local/bin/sieve-proxy-auth
auth_param basic children 5 startup=1 idle=1
auth_param basic realm Sieve
auth_param basic credentialsttl 5 minutes
authenticate_ttl 5 minutes
acl authenticated proxy_auth REQUIRED

# %un must come first: the helper uses it to pick the device's workspace.
external_acl_type sieve_acl ttl=300 negative_ttl=10 children-max=5 children-startup=2 children-idle=1 \
    %un %>ru %{X-Proxy-Origin-Url}>h \
    /usr/local/bin/sieve-acl-helper
acl sieve_allowed external sieve_acl

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !authenticated
# Tunnels are bumped, and each request inside them is checked against sieve_allowed.
http_access allow CONNECT
http_access allow sieve_allowed
http_access deny all

acl step1 at_step SslBump1
acl step2 at_step SslBump2
acl step3 at_step SslBump3
ssl_bump peek step1
ssl_bump stare step2
ssl_bump bump step3

tls_outgoing_options options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1 cafile=/etc/ssl/certs/ca-certificates.crt
