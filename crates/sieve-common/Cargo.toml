[package]
name = "sieve-common"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
fern = "0.7.1"
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { version = "1.53.1", features = ["rt"] }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
