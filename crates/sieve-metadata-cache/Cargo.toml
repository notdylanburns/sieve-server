[package]
name = "sieve-metadata-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
log = "0.4.34"
reqwest = { version = "0.13.4", features = ["gzip", "brotli", "deflate"] }
resvg = "0.48.1"
scraper = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sieve-common = { version = "0.1.0", path = "../sieve-common" }
sqlx = { workspace = true }
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["sync"] }
uuid = { workspace = true }
