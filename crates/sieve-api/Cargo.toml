[package]
name = "sieve-api"
version = "0.1.0"
edition = "2024"

[dependencies]
sieve-common = { path = "../sieve-common" }
axum = { version = "0.8.9", features = ["macros", "ws"] }
chrono = "0.4.45"
ipnetwork = "0.21.1"
log = "0.4.34"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.11.0"
site_icons = "0.6.4"
sqlx = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
url = "2.5.8"
uuid = { workspace = true }

[dev-dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
