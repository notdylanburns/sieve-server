[package]
name = "sieve-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sieve"
path = "src/main.rs"

[dependencies]
sieve-common = { path = "../sieve-common" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { version = "1.53.1", features = ["rt", "macros"] }
uuid = { workspace = true }
